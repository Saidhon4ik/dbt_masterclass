version: 2

models:
  - name: stg_payments
    description: "Cleaned payment transaction data from the raw ecommerce source."

    columns:
      - name: id
        description: "Unique identifier for each payment."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Identifier of the order associated with the payment."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: id