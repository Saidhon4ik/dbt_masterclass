version: 2

models:
  - name: mart_customer_analytics
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: customer_name
        data_tests:
          - not_null

      - name: customer_city
        data_tests:
          - not_null

      - name: total_spent
        data_tests:
          - not_null

      - name: total_orders
        data_tests:
          - not_null

      - name: avg_order_value
        data_tests:
          - not_null